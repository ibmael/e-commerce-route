<section class="bg-[#f8fafc] pb-8">
  <div class="border-b border-white/20 bg-linear-to-r from-[#6f2bff] to-[#a95cff] py-10 md:py-12">
    <div class="container">
      <div class="flex items-center gap-3 text-white">
        <span class="flex h-10 w-10 items-center justify-center rounded-xl bg-white/20">
          <i class="fa-solid fa-tags text-sm"></i>
        </span>
        <div>
          <h1 class="text-3xl font-bold">Top Brands</h1>
          <p class="text-sm text-white/80">Shop from your favorite brands</p>
        </div>
      </div>
    </div>
  </div>

  <div class="container -mt-2 py-7">
    <div class="grid grid-cols-2 gap-3 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 xl:grid-cols-6">
      @for (brand of brandsList(); track brand._id) {
        <article
          class="group flex min-h-36 flex-col items-center justify-center rounded-xl border border-gray-200 bg-white p-4 shadow-xs transition-all duration-200 hover:-translate-y-0.5 hover:shadow-md"
        >
          <div class="mb-3 flex h-12 w-full items-center justify-center">
            <img
              [src]="brand.image"
              [alt]="brand.name"
              class="max-h-full w-auto object-contain grayscale transition-all duration-200 group-hover:grayscale-0"
            />
          </div>
          <p class="line-clamp-1 text-center text-xs font-medium text-gray-700">{{ brand.name }}</p>
        </article>
      } @empty {
        <div class="col-span-full rounded-xl border border-dashed border-gray-300 bg-white p-12 text-center">
          <i class="fa-regular fa-folder-open mb-3 text-3xl text-gray-300"></i>
          <p class="font-medium text-gray-500">No brands found right now.</p>
        </div>
      }
    </div>
  </div>
</section>
